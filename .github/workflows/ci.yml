name: spring boot ci
on: 
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MongoDB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: Setup java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Give Maven wrapper execute permission
        run: chmod +x ./mvnw

      - name: build with maven
        run: ./mvnw clean package

      - name: Build Docker image
        run: docker compose build
        

      - name: Start application
        run: docker compose up -d
        
      - name: Wait for application
        run: sleep 15

      - name: Running Container
        run: docker compose ps

      - name: Server logs
        run: docker compose logs

      - name: Test application
        run: curl -f http://localhost:8080/swagger-ui/index.html#/user-controller/getUsers

      - name: Wait for application
        run: sleep 15
  
      - name: Stop application
        if: always()
        run: docker compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Tag Docker image
        run: docker tag springboot-devops sandeep07k/springboot-repo:latest
      
      - name: Push Docker image
        run: docker push sandeep07k/springboot-repo:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start EC2 instance
        run: |
          aws ec2 start-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

      - name: Wait for EC2
        run: |
          aws ec2 wait instance-running \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2"

            echo "Pulling latest Docker image..."
            docker pull sandeep07k/springboot-repo:latest

            echo "Stopping old container..."
            docker stop springboot-container1 || true

            echo "Removing old container..."
            docker rm springboot-container1 || true

            echo "Starting new container..."
            docker run -d \
              --name springboot-container1 \
              -p 8080:8080 \
              -e MongoDB_URI="${{ secrets.MONGODB_URI }}" \
              sandeep07k/springboot-repo:latest

            echo "Deployment completed!"
